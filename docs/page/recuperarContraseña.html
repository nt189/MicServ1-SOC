<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Recuperar Contraseña</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head> 
    <body class="cuerpo">
        <nav class="navbar navbar-expand-lg navbar-dark bg-custom shadow">
        <div class="container-fluid">
            <header class="header">
                <h1>Urban Market | Recuperar Contraseña</h1>
            </header>
        </div>
        </nav>

        <div class="container mt-5 mb-5">
            <div class="row justify-content-center">
                <div class="card bg-custom p-3" style="max-width: 500px;">
                    <div class="card-header bg-custom2 border-0 text-center fs-5 fw-bold">
                        ¿Olvidaste tu contraseña?
                        <div class="text-muted fs-6 fw-normal">Ingresa tu correo para recuperarla</div>
                    </div>

                    <div class="card-body">
                        <form id="forgotPassword">
                            <div class="mb-3">
                                <label for="email" class="form-label text-muted">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="correo@example.com" required>
                            </div>
                            <button type="button" class="btn btn-primary w-100 mt-4 shadow-sm" onclick="enviar()">Recuperar Contraseña</button>
                        </form>
                        
                        <div id="simulation-container" class="mt-4 text-center" style="display: none;">
                            <div class="alert alert-info">
                                <p><strong>Simulación:</strong> Se ha generado el siguiente enlace (en producción llegaría por correo):</p>
                                <a id="reset-link" href="#" class="btn btn-sm btn-warning">Ir a cambiar contraseña</a>
                            </div>
                        </div>
                        
                    </div>
                    <div class="text-center mt-3"> Volver al <a href="login.html">Inicio de sesión</a></div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/recuperarContrasena.js"></script>
    </body>
</html>
