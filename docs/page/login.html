<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Iniciar Sesión</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
        <link rel="preconnect" href="https://challenges.cloudflare.com" />
    </head> 
    <body class="cuerpo">
        <nav class="navbar navbar-expand-lg navbar-dark bg-custom shadow">
        <div class="container-fluid">
            <header class="header">
                <h1>Urban Market | Inicio de Sesión</h1>
            </header>

        </div>
        </nav>

        <div class="container mt-5 mb-5">
            <div class="row justify-content-center">
                <div class="card bg-custom p-3">
                    <div class="card-header bg-custom2 border-0 text-center fs-5 fw-bold">
                        Inicia Sesion para poder empezar a comprar.
                        <div class="text-muted fs-6 fw-normal">Nuevos clientes y Usuarios Vip</div>
                    </div>

                    <div class="card-body">
                        <form id="login">
                            <div class="mb-3">
                                <label for="email" class="form-label text-muted">Correo Electronico</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="correo@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label for="contraseña" class="form-label text-muted">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="Ingrese su contraseña" required>
                            </div>

                            <div class="mb-3 text-end">
                                <a href="recuperarContraseña.html" class="text-muted">¿Olvidaste tu contraseña?</a> 
                            </div>
                            
                            <center><div class="cf-turnstile mt-3" data-sitekey="0x4AAAAAADRirDHC0cM9aXKS" data-theme="light"></div></center>
                            
                            <button type="submit" class="btn btn-primary w-100 mt-4 shadow-sm">Iniciar Sesión</button>
                        </form>
                    </div>
                    <div> SI aun no tienes una cuenta registrate dando click <a href="registro.html">Aquí</a></div>

                </div>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
